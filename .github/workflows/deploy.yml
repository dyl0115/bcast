name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: doubledragon.duckdns.org
          username: dooyong
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/dooyong/projects/bcast
            git pull
            HOME=/root GOCACHE=/root/.cache/go go build -o /usr/local/bin/bcastd .
            sudo systemctl restart bcastd
